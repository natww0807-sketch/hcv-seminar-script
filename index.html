<script>
const SLIDES = [
  {
    id: 1,
    part: "Part 1｜Introduction（0:00–4:00）",
    title: "Slide 1｜Title",
    duration: "0:30",
    cumTime: "0:30",
    cumSec: 30,
    paragraphs: [
      "各位老師、同學大家好。我今天要報告的論文是 2026 年 7 月發表在 Journal of Clinical Microbiology 的〈Risk assessment and mitigation of hepatitis C virus RNA carryover contamination in a reflex testing algorithm〉，背景來自美國的醫院檢驗部。這篇想回答一個很實際的檢驗科問題：用同一管血先驗 HCV 抗體、再直接拿去驗 RNA，實驗室要怎麼管理交叉污染產生假陽性這個風險？"
    ]
  },
  {
    id: 2,
    part: "Part 1｜Introduction（0:00–4:00）",
    title: "Slide 2｜Background: HCV & Two-Step Diagnosis",
    duration: "1:15",
    cumTime: "1:45",
    cumSec: 105,
    paragraphs: [
      "先講背景。大多數感染 C 型肝炎病毒的人沒辦法自行清除病毒，會變成慢性感染，再慢慢進展成肝硬化、肝衰竭，甚至肝癌。現在已經有藥物 DAA 可以治癒，所以真正的關鍵在於「把病人找出來，並且接上治療」。",
      "要確診「活動性」感染需要兩步：第一步驗抗體，抗體陽性之後，第二步驗 HCV RNA。為什麼不能只看抗體？因為抗體只代表曾經暴露過，治癒或自己清掉病毒的人抗體也會一直是陽性。傳統做法是等抗體報告出來，再叫病人回來抽第二次血驗 RNA。在這種兩次採檢的模式下，有 33% 到 89% 的病人不會回來。也就是說，很多病人卡在抗體陽性這一步就斷掉了。因為在美國感染 C 型肝炎的這群人，正好就是脆弱的一群人，年輕靜脈注射藥癮者，你要讓他們再回來抽血，他們不太會回。"
    ]
  },
  {
    id: 3,
    part: "Part 1｜Introduction（0:00–4:00）",
    title: "Slide 3｜Single-Visit Testing: Two Tubes vs. Reflex",
    duration: "1:15",
    cumTime: "3:00",
    cumSec: 180,
    paragraphs: [
      "為了解決這個問題，美國 CDC 在 2023 年的操作指引中建議「單次就診完成檢測」，也就是抗體和 RNA 都用同一次就診抽的血來做。做法有兩種。",
      "第一種是一次抽兩管，一管驗抗體、一管留著驗 RNA。這完全沒有交叉污染的問題，但美國 HCV 抗體盛行率只有 1.7%，代表有 98% 多抽的那一管根本用不到，實務上很難執行，會浪費掉很多的醫療資源。",
      "第二種就是今天的主角：reflex testing，抗體陽性後直接拿同一管去驗 RNA。研究顯示這可以讓「漏做 RNA 確認」的比例降低最多 76%，也能明顯改善銜接治療的比例。聽起來很好，但根據美國公衛實驗室協會的調查，還有大約一半的實驗室沒有採用 reflex 策略。為什麼？這就跟今天的論文主題有關，因為它們怕檢體在「上游血清學儀器」已被開蓋或分注吸取過，所以存在發生交叉污染（Carryover）的風險。"
    ]
  },
  {
    id: 4,
    part: "Part 1｜Introduction（0:00–4:00）",
    title: "Slide 4｜Research Gap & Aims",
    duration: "1:00",
    cumTime: "4:00",
    cumSec: 240,
    paragraphs: [
      "剛才講到最大的顧慮就是 carryover contamination。抗體是在上游的化學免疫分析儀上做的，如果機器用固定針吸檢體，前一管高病毒量的檢體可能殘留一點點在針上，污染到下一管陰性檢體。之後這管拿去做非常靈敏的 PCR，就可能測出一個低病毒量的假陽性。過去文獻認為這類污染主要出現在 1,000 IU/mL 以下的低病毒量；也有研究在 cobas 6800 上，觀察到緊接著陽性檢體上機的陰性檢體中有 3.29% 被污染。這在臨床上來說，就會造成不必要的醫療處置。",
      "所以這篇研究有三個目的：第一，在真實的 5 間區域實驗室中量化污染風險；第二，評估一套針對低陽性結果的審核流程能不能降低假陽性；第三，提供其他實驗室可以照著做的 SOP。"
    ]
  },
  {
    id: 5,
    part: "Part 2｜Methods（4:00–8:45）",
    title: "Slide 5｜Study Design Overview",
    duration: "1:00",
    cumTime: "5:00",
    cumSec: 300,
    paragraphs: [
      "研究在 Cleveland Clinic（克里夫蘭醫學中心）的檢驗進行。抗體在五家區域實驗室做，A、B、C 在俄亥俄州，D、E 在佛羅里達州。只要抗體是 reactive 或 equivocal，原管就送到中央分子實驗室，用 Roche cobas 8800 做 HCV RNA，偵測下限是 15 IU/mL。",
      "研究分兩部分。第一部分是刻意設計的污染模擬測試，研究者把殘餘病人血清混成 5 管高陽性，每管都超過一百萬 IU/mL，再混 5 管 RNA 陰性，送到五家實驗室，要求用「一正一負交替」的順序上機驗抗體。這等於刻意製造最容易污染的情境，每一管陰性前面都緊接著一管超高病毒量的檢體。做完後送回中央實驗室，看陰性那幾管有沒有驗出 RNA；第二部分是導入了一套新作業流程，橫跨 33 個月的前後對照研究，總共 9,237 件抗體異常檢體，其中 157 件低陽性逐一翻病歷判定真偽。"
    ]
  },
  {
    id: 6,
    part: "Part 2｜Methods（4:00–8:45）",
    title: "Slide 6｜Part 1: Contrived Carryover Assessment（Table 1）",
    duration: "1:30",
    cumTime: "6:30",
    cumSec: 390,

let current = Number(localStorage.getItem("hcv_slide_idx") || 0);
if (current < 0 || current >= SLIDES.length) current = 0;

let fontSize = Number(localStorage.getItem("hcv_font_size") || 20);
let theme = localStorage.getItem("hcv_theme") || "light";

const cardEl = document.getElementById("card");
const scrollerEl = document.getElementById("cardScroller");
const progressFill = document.getElementById("progressFill");
const pageNum = document.getElementById("pageNum");
const pageTarget = document.getElementById("pageTarget");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const drawer = document.getElementById("drawer");
const drawerBackdrop = document.getElementById("drawerBackdrop");
const drawerList = document.getElementById("drawerList");
const themeBtn = document.getElementById("themeBtn");

function applyTheme() {
  document.body.setAttribute("data-theme", theme);
  themeBtn.textContent = theme === "light" ? "☾" : "☀︎";
  localStorage.setItem("hcv_theme", theme);
}

function applyFontSize() {
  document.documentElement.style.setProperty("--script-size", fontSize + "px");
  localStorage.setItem("hcv_font_size", String(fontSize));
}

function renderSlide(animateDir = 0) {
  const s = SLIDES[current];
  localStorage.setItem("hcv_slide_idx", String(current));

  if (animateDir !== 0) {
    scrollerEl.style.transition = "none";
    scrollerEl.style.opacity = "0.25";
    scrollerEl.style.transform = `translateX(${animateDir > 0 ? 28 : -28}px)`;
  }

  let bodyHtml = "";
  if (s.isQA) {
    bodyHtml = s.qas.map((item, idx) => `
      <div class="qa-item${idx > 0 ? " collapsed" : ""}">
        <button class="qa-q" type="button">
          <span>${item.q}</span>
          <span class="qa-arrow">▼</span>
        </button>
        <div class="qa-a">${item.a}</div>
      </div>
    `).join("");
  } else {
    bodyHtml = `<div class="script-body">${s.paragraphs.map(p => `<p>${p}</p>`).join("")}</div>`;
  }

  const nextSlide = SLIDES[current + 1];
  const nextHintHtml = nextSlide ? `
    <div class="next-hint" id="nextHint">
      <span>下一頁：<strong>${nextSlide.title}</strong></span>
      <span>→</span>
    </div>
  ` : "";

  cardEl.innerHTML = `
    <div class="meta-row">
      <span class="part-badge">${s.part}</span>
      <span class="time-chip">${s.isQA ? "提問環節" : `建議 ${s.duration} · 累計至 ${s.cumTime}`}</span>
    </div>
    <h1 class="slide-title">${s.title}</h1>
    ${bodyHtml}
    ${nextHintHtml}
  `;

  if (s.isQA) {
    cardEl.querySelectorAll(".qa-q").forEach(btn => {
      btn.addEventListener("click", () => {
        btn.parentElement.classList.toggle("collapsed");
      });
    });
  }

  const nh = document.getElementById("nextHint");
  if (nh) nh.addEventListener("click", () => goTo(current + 1, 1));

  scrollerEl.scrollTop = 0;

  if (animateDir !== 0) {
    requestAnimationFrame(() => {
      scrollerEl.style.transition = "transform 0.22s ease, opacity 0.22s ease";
      scrollerEl.style.opacity = "1";
      scrollerEl.style.transform = "translateX(0)";
    });
  }

  const pct = ((current + 1) / SLIDES.length) * 100;
  progressFill.style.width = pct + "%";

  if (s.isQA) {
    pageNum.textContent = "備用 Q&A";
    pageTarget.textContent = "5 題防禦";
  } else {
    pageNum.textContent = `${s.id} / 17`;
    pageTarget.textContent = `目標 ${s.cumTime}`;
  }

  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === SLIDES.length - 1;
  nextBtn.textContent = current === 16 ? "備用 Q&A ›" : "下一頁 ›";

  updateTimerColor();
  renderDrawer();
}

function goTo(index, dir = 0) {
  if (index < 0 || index >= SLIDES.length || index === current) return;
  current = index;
  renderSlide(dir);
}

function renderDrawer() {
  drawerList.innerHTML = SLIDES.map((s, idx) => `
    <button class="drawer-item ${idx === current ? "active" : ""}" data-idx="${idx}">
      <div>
        <div class="drawer-item-title">${s.title}</div>
        <div class="drawer-item-sub">${s.part}</div>
      </div>
      <div class="drawer-item-time">${s.isQA ? "Q&A" : `${s.duration} / ${s.cumTime}`}</div>
    </button>
  `).join("");

  drawerList.querySelectorAll(".drawer-item").forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = Number(btn.dataset.idx);
      closeDrawer();
      goTo(idx, idx > current ? 1 : -1);
    });
  });
}

function openDrawer() {
  drawer.classList.add("open");
  drawerBackdrop.classList.add("open");
  const active = drawerList.querySelector(".drawer-item.active");
  if (active) active.scrollIntoView({ block: "center" });
}
function closeDrawer() {
  drawer.classList.remove("open");
  drawerBackdrop.classList.remove("open");
}

// Timer logic
let timerRunning = false;
let elapsedSec = 0;
let timerInterval = null;
const timerBtn = document.getElementById("timerBtn");
const timerDisplay = document.getElementById("timerDisplay");

function formatTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return `${m}:${s}`;
}

function updateTimerColor() {
  const s = SLIDES[current];
  timerBtn.classList.remove("overtime");
  if (!s.isQA && elapsedSec > s.cumSec) {
    timerBtn.classList.add("overtime");
  }
}

timerBtn.addEventListener("click", () => {
  timerRunning = !timerRunning;
  timerBtn.classList.toggle("running", timerRunning);
  if (timerRunning) {
    timerInterval = setInterval(() => {
      elapsedSec++;
      timerDisplay.textContent = formatTime(elapsedSec);
      updateTimerColor();
    }, 1000);
  } else {
    clearInterval(timerInterval);
  }
});

document.getElementById("timerResetBtn").addEventListener("click", () => {
  timerRunning = false;
  clearInterval(timerInterval);
  elapsedSec = 0;
  timerDisplay.textContent = "00:00";
  timerBtn.classList.remove("running", "overtime");
});

// Controls
prevBtn.addEventListener("click", () => goTo(current - 1, -1));
nextBtn.addEventListener("click", () => goTo(current + 1, 1));
document.getElementById("menuBtn").addEventListener("click", openDrawer);
document.getElementById("pageIndicator").addEventListener("click", openDrawer);
document.getElementById("closeDrawerBtn").addEventListener("click", closeDrawer);
drawerBackdrop.addEventListener("click", closeDrawer);

document.getElementById("fontDownBtn").addEventListener("click", () => {
  fontSize = Math.max(15, fontSize - 2);
  applyFontSize();
});
document.getElementById("fontUpBtn").addEventListener("click", () => {
  fontSize = Math.min(30, fontSize + 2);
  applyFontSize();
});
themeBtn.addEventListener("click", () => {
  theme = theme === "light" ? "dark" : "light";
  applyTheme();
});

// Keyboard navigation
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "PageDown") goTo(current + 1, 1);
  if (e.key === "ArrowLeft" || e.key === "PageUp") goTo(current - 1, -1);
  if (e.key === "Escape") closeDrawer();
});

// Touch Swipe Gestures
let touchStartX = 0;
let touchStartY = 0;
let isSwiping = false;
const stage = document.getElementById("stage");

stage.addEventListener("touchstart", e => {
  if (e.touches.length !== 1) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  isSwiping = true;
}, { passive: true });

stage.addEventListener("touchend", e => {
  if (!isSwiping) return;
  isSwiping = false;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 52 && Math.abs(dx) > Math.abs(dy) * 1.4) {
    if (dx < 0) goTo(current + 1, 1);
    else goTo(current - 1, -1);
  }
}, { passive: true });

applyTheme();
applyFontSize();
renderSlide(0);
</script>
</body>
</html>
